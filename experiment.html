<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>案例复现故意对比实验 - Three.js</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #16213e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #experiment-panel {
      position: absolute;
      top: 15px;
      left: 20px;
      color: #ffffff;
      background: rgba(22, 33, 62, 0.9);
      padding: 14px 20px;
      border-radius: 10px;
      border: 1px solid rgba(239, 83, 80, 0.5);
      z-index: 100;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
      max-width: 480px;
    }
    #experiment-panel h1 {
      margin: 0 0 6px 0;
      font-size: 16px;
      font-weight: 600;
      color: #ef5350;
    }
    #experiment-panel p {
      margin: 0 0 10px 0;
      font-size: 13px;
      color: #e0e0e0;
      line-height: 1.4;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }
    button {
      background: #263238;
      color: #eceff1;
      border: 1px solid #455a64;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    button.active, button:hover {
      background: #ef5350;
      border-color: #ef5350;
      color: #ffffff;
      font-weight: bold;
    }
    #status-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      background: rgba(239, 83, 80, 0.2);
      color: #ff8a80;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
  <div id="experiment-panel">
    <div id="status-tag">讲义指定故意实验观测</div>
    <h1>故意实验：相机进物体内部与独立Mesh旋转</h1>
    <p id="exp-desc">当前状态：相机位置设为 (0, 0, 0)，相机处于底座内部，发生穿模剔除！展品切换为独立 mesh 原地自转。</p>
    <div class="btn-group">
      <button id="btn-inside" class="active" onclick="setInside()">实验状态：相机进物体(0,0,0)</button>
      <button id="btn-normal" onclick="setNormal()">对照状态：正常外部视角(4,3,6)</button>
    </div>
  </div>
  <script src="libs/three.min.js"></script>
  <script src="libs/OrbitControls.js"></script>
  <script src="experiment.js"></script>
</body>
</html>
